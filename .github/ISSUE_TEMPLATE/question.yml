name: Câu hỏi / Question
description: Hỏi cách dùng Ghostline. / Ask how to use Ghostline.
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Nhiều câu đã có trả lời trong [Hỏi đáp / FAQ](https://hashcott.github.io/ghostline/faq.html) và [Hướng dẫn / Guide](https://hashcott.github.io/ghostline/guide.html).
        Many questions are already answered in the FAQ and the guide.
  - type: textarea
    id: question
    attributes:
      label: Câu hỏi của bạn / Your question
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Phiên bản Ghostline và hệ điều hành / Ghostline version and OS
      placeholder: "0.7.0, Windows 11"
