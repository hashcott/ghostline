name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The full CI (lint, tests, race tests, build) on the tagged commit.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Builds and publishes only when CI passed.
  release:
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install wails3 and NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Frontend deps
        working-directory: frontend
        run: npm ci
      - name: Bindings and frontend
        shell: pwsh
        run: |
          wails3 generate bindings -clean=true -ts -i
          Push-Location frontend; npm run build; Pop-Location
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          wails3 package VERSION=$v
          wails3 task windows:portable VERSION=$v
      # Linux work must not bloat the Windows exe (spec Linux §17). Raising
      # the limit is an explicit edit of -max here.
      - name: Windows exe size guard
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $prev = gh release view --json tagName -q .tagName 2>$null
          if (-not $prev) { "No previous release: size guard skipped"; exit 0 }
          gh release download $prev -p "*portable.zip" -D prev
          $old = (Get-ChildItem prev -Filter *portable.zip | Select-Object -First 1).FullName
          go run ./tools/sizecheck -old $old -new "bin/Ghostline-$v-portable.zip" -entry ghostline.exe -max 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem bin -File | Where-Object { $_.Name -like "*installer.exe" -or $_.Name -like "*portable.zip" }
          # LF line endings so `sha256sum -c` works too, not only Get-FileHash.
          $lines = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          [IO.File]::WriteAllText("$PWD/bin/SHA256SUMS", (($lines -join "`n") + "`n"), [Text.Encoding]::ASCII)
          Get-Content bin/SHA256SUMS
      - name: GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem bin -File | Where-Object { $_.Name -like "*installer.exe" -or $_.Name -like "*portable.zip" -or $_.Name -eq "SHA256SUMS" } | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" @assets --generate-notes
