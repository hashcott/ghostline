name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The full CI (lint, tests, race tests, build) on the tagged commit.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Windows installer and portable zip; published by the publish job.
  windows:
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install wails3 and NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Frontend deps
        working-directory: frontend
        run: npm ci
      - name: Bindings and frontend
        shell: pwsh
        run: |
          wails3 generate bindings -clean=true -ts -i
          Push-Location frontend; npm run build; Pop-Location
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          wails3 package VERSION=$v
          wails3 task windows:portable VERSION=$v
      # Linux work must not bloat the Windows exe (spec Linux §17). Raising
      # the limit is an explicit edit of -max here.
      - name: Windows exe size guard
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $prev = gh release view --json tagName -q .tagName 2>$null
          if (-not $prev) { "No previous release: size guard skipped"; exit 0 }
          gh release download $prev -p "*portable.zip" -D prev
          $old = (Get-ChildItem prev -Filter *portable.zip | Select-Object -First 1).FullName
          go run ./tools/sizecheck -old $old -new "bin/Ghostline-$v-portable.zip" -entry ghostline.exe -max 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep the Windows files for publish
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            bin/*installer.exe
            bin/*portable.zip

  # deb, rpm, AppImage and tar.gz (spec Linux L5 §8.2).
  linux:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: GTK4, WebKitGTK and packaging tools
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev squashfs-tools
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27
      - name: Frontend deps
        working-directory: frontend
        run: npm ci
      - name: Package
        run: wails3 task linux:package VERSION="${GITHUB_REF_NAME#v}"
      - name: Keep the Linux files for publish
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            bin/*.deb
            bin/*.rpm
            bin/*.AppImage
            bin/*.tar.gz

  # One SHA256SUMS for every file (signed: the app checks it before it
  # installs an update), the PKGBUILD filled in, the release.
  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      # Only this workflow's packages: the reusable CI run uploads its own
      # 0.0.0-ci tarball into the same run.
      - uses: actions/download-artifact@v4
        with:
          pattern: "{windows,linux}"
          path: dist
          merge-multiple: true
      - name: Nothing but this release's files
        run: |
          ls -la dist
          v="${GITHUB_REF_NAME#v}"
          # deb and rpm spell a pre-release 0.6.0~rc1.
          if ls dist | grep -v -F -e "$v" -e "$(printf '%s' "$v" | tr - '~')" -e ghostline-amd64-installer.exe; then
            echo "unexpected files in dist (above)" >&2
            exit 1
          fi
      - name: Checksums and PKGBUILD
        run: |
          v="${GITHUB_REF_NAME#v}"
          sh build/linux/aur/render.sh "$v" "dist/ghostline-$v-linux-amd64.tar.gz" > dist/PKGBUILD
          cp build/linux/aur/ghostline.install dist/
          cd dist
          sha256sum -- *installer.exe *portable.zip *.deb *.rpm *.AppImage *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      # The one-click update installs only an installer listed in a
      # SHA256SUMS signed with the server-list key (internal/updater).
      - name: Sign SHA256SUMS
        env:
          SERVERLIST_SIGNING_KEY: ${{ secrets.SERVERLIST_SIGNING_KEY }}
        run: go run ./tools/genservers -sign-file dist/SHA256SUMS -sign-env SERVERLIST_SIGNING_KEY
      # v0.8.0-beta.1, v0.8.0-rc.1 …: a pre-release. GitHub's "latest", the
      # download page and the app's stable channel skip it; only users who
      # turned on beta versions are told about it.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes $pre
