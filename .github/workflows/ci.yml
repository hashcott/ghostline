name: ci

# Docs-only changes don't touch the build, so they skip CI. Tags are left
# to the release workflow, which calls this workflow first and builds only
# when it passes.
on:
  workflow_call:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27
      - name: Frontend deps
        working-directory: frontend
        run: npm ci
      - name: Generate bindings
        run: wails3 generate bindings -clean=true -ts -i
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: Go tests
        run: go test ./...
      - name: Go race tests (rules, proxy, app)
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/rules/... ./internal/proxy/... ./internal/app/...
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Build
        run: wails3 build

  # Linux (spec Linux §17): the GTK4 build, every test, a Windows type-check
  # so Linux-side work cannot break the Windows build unnoticed, and the
  # dependency guard that keeps each OS's code out of the other's binary.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: GTK4, WebKitGTK and packaging tools
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev squashfs-tools rpm
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27
      - name: Frontend deps
        working-directory: frontend
        run: npm ci
      - name: Generate bindings
        run: wails3 generate bindings -clean=true -ts -i
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: Go tests
        run: go test ./...
      - name: Root integration (system DNS, nftables queue + nfqws2 fail-open, kill -9 recovery)
        run: |
          sudo modprobe nfnetlink_queue nft_queue || true
          sudo -E env "PATH=$PATH" go test -tags integration_root ./internal/sysdns/ ./internal/dpi/ ./cmd/ghostlined/
      - name: Go race tests (rules, proxy, app)
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/rules/... ./internal/proxy/... ./internal/app/...
      - name: Windows type-check
        env:
          GOOS: windows
        run: go vet ./...
      - name: Dependency guard
        run: go run ./tools/depcheck
      - name: Build
        run: go build -o /dev/null .
      - name: Generated code is current
        run: go generate ./...
      - name: No diff after generate
        run: git diff --exit-code
      - name: Daemon builds without cgo
        env:
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/ghostlined
      - name: Linux packages (deb, rpm, AppImage, tar.gz)
        run: wails3 task linux:package VERSION=0.0.0-ci
      - name: Package scripts
        run: bash build/linux/nfpm/scripts/scripts_test.sh
      - name: Package contents
        run: |
          dpkg-deb -I bin/ghostline_*_amd64.deb
          dpkg-deb -c bin/ghostline_*_amd64.deb
          rpm -qip bin/ghostline-*.x86_64.rpm
          rpm -qlp bin/ghostline-*.x86_64.rpm
          mkdir -p /tmp/appimage && cd /tmp/appimage && "$GITHUB_WORKSPACE"/bin/Ghostline-0.0.0-ci-x86_64.AppImage --appimage-extract >/dev/null
          ls -la /tmp/appimage/squashfs-root /tmp/appimage/squashfs-root/usr/bin /tmp/appimage/squashfs-root/usr/lib/ghostline
      - name: Install, connect, remove and purge (deb)
        run: bash build/linux/ci/smoke.sh deb
      - name: Install, connect and uninstall (tar.gz)
        run: bash build/linux/ci/smoke.sh tarball
      - name: Keep the tar.gz for the PKGBUILD check
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: bin/ghostline-0.0.0-ci-linux-amd64.tar.gz

  # The PKGBUILD (AUR ghostline-bin) still builds from the tar.gz.
  pkgbuild:
    needs: linux
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: linux-tarball
          path: bin
      - name: makepkg
        run: |
          useradd -m builder
          mkdir /tmp/aur
          cp bin/ghostline-0.0.0-ci-linux-amd64.tar.gz build/linux/aur/ghostline.install /tmp/aur/
          sh build/linux/aur/render.sh 0.0.0-ci /tmp/aur/ghostline-0.0.0-ci-linux-amd64.tar.gz --local > /tmp/aur/PKGBUILD
          chown -R builder /tmp/aur
          su builder -c 'cd /tmp/aur && makepkg --nodeps --noconfirm'
          bsdtar -tf /tmp/aur/ghostline-bin-*.pkg.tar.zst
