name: pages

# The download page and its guide, FAQ, changelog and disclaimer (site/) on
# GitHub Pages: https://hashcott.github.io/ghostline/
# It reads the releases from the GitHub API in the visitor's browser. It
# deploys once a release has been built and published, so it never points
# at a release whose files are not up yet; run it by hand to ship a page
# change between releases. Requires Settings → Pages → Source: "GitHub
# Actions".
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble
        run: |
          mkdir -p _site
          cp site/* _site/
          cp docs/screenshots/simple-vi.png docs/screenshots/simple-en.png build/appicon.png _site/
          # The guide, FAQ and disclaimer pages render these in the browser.
          mkdir -p _site/docs/screenshots _site/docs/videos/clips
          cp docs/huong-dan-su-dung.md docs/user-guide.md README.md README.vi.md _site/docs/
          cp docs/screenshots/*.png _site/docs/screenshots/
          cp docs/videos/clips/*.webp _site/docs/videos/clips/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
